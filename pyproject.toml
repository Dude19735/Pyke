[build-system]
requires = ["scikit-build-core >=0.11.3", "nanobind >=2.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pyke3d"
version = "0.1.0"
description = "Pyke is a tool based on the Vulkan API that can be used to visualize 3D objects using Numpy arrays."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Dumeni Manatschal", email = "dumeni.manatschal@gmail.com" },
]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]
# Optional: runtime dependency specification
dependencies = [ "numpy" ]

[project.urls]
Homepage = "https://github.com/Dude19735/Pyke"

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "0.11.3"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"
